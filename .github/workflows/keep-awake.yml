name: Keep backend awake

# Render's free server falls asleep after 15 minutes without visitors, and the next visitor then waits
# about a minute. This visits the health check every 10 minutes so it stays awake (free for public repos).
# Note: GitHub can delay scheduled runs a little, and pauses them if the repo has no commits for 60 days
# (GitHub sends an email, one click re-enables it).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # can also be started by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BACKEND_URL: https://gen-ai-zt3h.onrender.com

    steps:
      - name: Ping the backend
        run: curl --silent --show-error --fail --max-time 90 --retry 2 "$BACKEND_URL/api/health"
